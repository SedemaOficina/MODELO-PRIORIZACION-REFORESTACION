# Verificación automática (A1-01 de la auditoría del 19 oct 2026; decisión de Liber: las rápidas en GitHub en cada Push).
# Dos trabajos: las mismas verificaciones rápidas que «node 04_pruebas/correr_todas.js rapidas» en el equipo de trabajo (sin navegador) y
# el flujo principal en Firefox y WebKit (prueba_navegadores.js).
# Cuáles son y qué revisa cada una: 04_pruebas/LEEME.md. Explicación para quien administra el repositorio: 05_documentacion/verificacion_automatica_github.md
# Si falla, GitHub muestra una cruz roja en el commit y avisa por correo; la página publicada no cambia por ello.
name: Verificar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rapidas:
    name: Verificaciones rápidas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # las rápidas no abren el navegador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herramientas de prueba (versiones fijadas en package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Módulo de inicio de sesión (sus propias versiones fijadas)
        run: npm ci --no-audit --no-fund --prefix 08_entrega_sia/login/backend
      - name: Verificaciones rápidas
        run: node 04_pruebas/correr_todas.js rapidas
  navegadores:
    # Firefox y Safari (WebKit): el flujo principal fuera de Chromium (decisión de Liber del 21 oct 2026). En el equipo de trabajo
    # Windows no deja abrir el Firefox de las pruebas; aquí se instalan los dos y un motor que no abre cuenta como falla.
    name: Firefox y WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herramientas de prueba (versiones fijadas en package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Firefox y WebKit de Playwright, con lo que necesitan del sistema
        run: npx playwright install --with-deps firefox webkit
      - name: Flujo principal en Firefox y WebKit
        run: node 04_pruebas/prueba_navegadores.js
        env:
          NAVEGADORES_OBLIGATORIOS: '1'
